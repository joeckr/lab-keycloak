app:
  name: keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.8.2-3"
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  managementPort: 9000
  hostname: "https://keycloak.joeckr.dev"
  proxyHeaders: "xforwarded"
  admin:
    username: admin
  podAnnotations: {}
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 1031
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

service:
  name: keycloak
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: true
  name: keycloak-route
  host: "keycloak.joeckr.dev"
  parentRefs:
    - name: traefik-gateway
      namespace: gateway
      sectionName: web
  path: /
  pathType: PathPrefix

ingress:
  enabled: false
  name: keycloak-ingress
  host: "keycloak.joeckr.dev"
  className: "nginx"
  path: /
  pathType: "Prefix"

secret:
  # Set create: false or provide existingSecret when managing secrets externally (e.g. External Secrets Operator).
  create: true
  existingSecret: ""
  keys:
    adminPassword: "KC_BOOTSTRAP_ADMIN_PASSWORD"  # betterleaks:allow
    dbPassword: "KC_DB_PASSWORD"  # betterleaks:allow
  data:
    KC_BOOTSTRAP_ADMIN_PASSWORD: "changeme"  # betterleaks:allow
    KC_DB_PASSWORD: "changeme"  # betterleaks:allow

db:
  enabled: true
  app:
    name: keycloak-db
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    db: keycloak
    user: keycloak
    storageSize: 10Gi
  secret:
    create: true
    existingSecret: ""
    keys:
      password: "POSTGRES_PASSWORD"  # betterleaks:allow
    data:
      POSTGRES_PASSWORD: "changeme"  # betterleaks:allow
